services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bai
      POSTGRES_PASSWORD: bai
      POSTGRES_DB: bai
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
