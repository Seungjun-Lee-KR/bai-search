[project]
name = "bai-search"
version = "0.1.0"
description = "감사원 결정례·감사결과 검색 서비스"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.6",
  "pdfplumber>=0.11",
  "olefile>=0.47",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
local = ["sentence-transformers>=3.0"]   # EMBED_BACKEND=local (권장, 원문 외부 전송 없음)
voyage = ["voyageai>=0.3"]               # EMBED_BACKEND=voyage

[project.scripts]
bai = "bai_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
bai_search = ["index.html"]
